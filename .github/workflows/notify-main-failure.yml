# Reusable workflow: post a Slack alert to the engineering channel when a
# workflow that runs on push to main/staging FAILS, and a follow-up when it
# RECOVERS.
#
# This is the shape a PIPELINE needs: a terminal JOB that `needs:` every other
# job in the workflow, so the alert fires on a failure anywhere in the graph,
# including a mid-graph failure that only skips its dependents rather than
# failing them. The release-train workflows (freeze, unfreeze, sync, release-pr)
# do not need a job, because they own a single job and can end with a step, so
# they call the `notify-pipeline-status` composite directly. Both run the same
# code — this file is a thin wrapper around that composite, and the alert's copy,
# its freeze scoping and its recovery detection all live there.
#
# A failed merge pipeline is a silent prod-risk event: main-triggered workflows
# cut releases and bake + deploy prod images.
#
# Two modes, selected by `status`:
#   - failed:    posts a red alert.
#   - recovered: posts a green "recovered" message ONLY when the previous
#     conclusive run of this workflow on this branch failed. On a normal green
#     run it no-ops, so the channel is not spammed on every merge. Derived from
#     the GitHub API rather than cross-run state, so it is self-healing.
#
# `freeze-scoped: true` scopes a STAGING caller to the release window:
#
#   anything on main                      -> alert
#   staging, freeze window OPEN           -> alert
#   staging, freeze window NOT open       -> NOTHING, in either mode
#
# That last row means exactly what it says, and it is the fix for what this
# workflow used to do. On 2026-08-13 cowork-server's staging publish failed on
# the commit that FIXED a broken release candidate; the failure was correctly
# silent, and the re-run three and a half hours later posted a green "Recovered".
# The only thing the channel ever heard about a stalled rc stream was the good
# news. Posting only the green half is worse than posting neither.
#
# The run is still red in the Actions tab either way, and `pipeline-watchdog.yml`
# covers both a staging branch that stops building at all and one that STAYS red
# into the freeze window.
#
# Prod callers leave `freeze-scoped` alone: a failure there is always worth
# interrupting for. A workflow triggered on BOTH main and staging from one notify
# job cannot hardcode this — pass an expression instead, or a main failure gets
# silenced too:
#   freeze-scoped: ${{ github.ref_name == 'staging' }}
#
# ONE caller job covers both modes: a `uses:` job cannot branch on status, so the
# caller derives the aggregate outcome from `needs.*.result` and passes it in.
# Cancelled runs stay silent.
#   auth/.github/workflows/prod-build-deploy.yml
#     notify:
#       needs: [linter, run-unit-tests, build-auth, scan-auth, migrate, deploy, integration-tests]
#       if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') }}
#       permissions:
#         contents: read
#         actions: read
#       uses: mindsdb/github-actions/.github/workflows/notify-main-failure.yml@<sha> # v1
#       with:
#         env-name: "prod build+deploy"
#         status: ${{ contains(needs.*.result, 'failure') && 'failed' || 'recovered' }}
#       secrets: inherit
#
# Requires (reach this workflow via `secrets: inherit` in the caller):
#   - secrets.SLACK_ENG_CHANNEL_ID       (the engineering channel; org secret)
#   - secrets.GH_ACTIONS_SLACK_BOT_TOKEN (the Slack bot token; org secret)
# The Slack bot must be a member of the channel SLACK_ENG_CHANNEL_ID resolves to.
#
# Recovery mode also needs `actions: read` on the CALLER's notify job. The default
# workflow token carries contents + packages read only, and a called workflow can
# never hold more than its caller grants, so without that block the prior-run
# lookup is refused. It degrades to silence rather than failing, so a missing
# grant never turns a green pipeline red.

name: Notify main-branch failure

on:
  workflow_call:
    inputs:
      env-name:
        description: "Short label for the pipeline (e.g. 'prod build+deploy', 'staging freeze')"
        type: string
        required: true
      status:
        description: "'failed' (red alert) or 'recovered' (green, only if the prior run was failing)"
        type: string
        default: failed
      freeze-scoped:
        description: "Silence this caller entirely while the staging freeze window is closed. For staging pipelines, where neither a failure nor its recovery is release-relevant mid-week."
        type: boolean
        default: false
      ruleset-name:
        description: "The freeze ruleset to read. Must match what the repo's release-freeze caller sets, or this reads a name that does not exist and escalates every staging failure forever."
        type: string
        default: staging-freeze
      runs-on:
        description: "Runner label for the notify job"
        type: string
        # GitHub-hosted on purpose. This job posts a Slack message and needs no
        # cluster, no cloud and no self-hosted anything, and an alert that runs on
        # the self-hosted fleet cannot report that the self-hosted fleet is down —
        # the one outage where every pipeline goes red at once is the one where
        # this would have nothing to run on.
        default: ubuntu-latest
  # Manual smoke test: run this workflow from the Actions tab to post a sample
  # message to the eng channel. `status: recovered` always posts here (the
  # prior-run check is skipped on a manual dispatch), so both styles are testable
  # on demand.
  workflow_dispatch:
    inputs:
      env-name:
        description: "Label to show in the test message"
        type: string
        default: "manual test"
      status:
        description: "failed or recovered"
        type: choice
        options: [failed, recovered]
        default: failed
      runs-on:
        description: "Runner label"
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  actions: read  # read the previous run's conclusion for recovery detection

jobs:
  notify:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out the shared alert implementation
        uses: actions/checkout@v5
        with:
          repository: mindsdb/github-actions
          # The commit of THIS reusable, not of main. A consumer that pins this
          # workflow to a sha gets that sha's composite and scripts too, which is
          # what makes the pin mean anything.
          ref: ${{ github.job_workflow_sha }}
          path: .ci-shared
          persist-credentials: false

      # Minted here rather than inside the composite because a composite action's
      # steps cannot use `continue-on-error`, and a repo with no release-train App
      # must degrade to "assume frozen" rather than fail the notify job.
      - name: Mint release-train App token
        id: freeze-token
        if: inputs.freeze-scoped
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Notify
        uses: ./.ci-shared/notify-pipeline-status
        with:
          env-name: ${{ inputs.env-name }}
          status: ${{ inputs.status }}
          freeze-scoped: ${{ inputs.freeze-scoped }}
          ruleset-name: ${{ inputs.ruleset-name }}
          freeze-token: ${{ steps.freeze-token.outputs.token }}
          github-token: ${{ github.token }}
          slack-channel-id: ${{ secrets.SLACK_ENG_CHANNEL_ID }}
          slack-bot-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
