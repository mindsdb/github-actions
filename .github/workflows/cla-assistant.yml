# Reusable workflow: the CLA signature check on pull requests from outside
# contributors, for the public repos (cowork, cowork-server, anton).
#
# The bot comments on an unsigned PR, records a signature when the contributor
# replies with the agreement sentence, and re-checks on `recheck`. Signatures are
# committed to a signature file on a side branch of the CALLING repo, so every
# repo keeps its own signature ledger.
#
# Called from a per-repo wrapper that keeps the triggers, since the action reads
# `issue_comment` and `pull_request_target` payloads directly, e.g.
#   anton/.github/workflows/cla.yml
#     name: "MindsDB Anton CLA Assistant"
#     permissions:
#       actions: write
#       contents: write
#       pull-requests: write
#       statuses: write
#     on:
#       issue_comment:
#         types: [created]
#       pull_request_target:
#         types: [opened, closed, synchronize]
#     jobs:
#       cla:
#         uses: mindsdb/github-actions/.github/workflows/cla-assistant.yml@<sha> # v1
#         with:
#           path-to-document: 'https://github.com/mindsdb/mindsdb/blob/main/assets/contributions-agreement/individual-contributor.md'
#           allowlist: bot*, ZoranPandovski, ...
#
# The caller must declare those four permissions: the action writes the
# signature file, comments on the PR, and sets the commit status, and a called
# workflow can never hold more than its caller grants.

name: CLA Assistant

on:
  workflow_call:
    inputs:
      path-to-document:
        description: "URL of the contributor agreement the bot links to"
        type: string
        required: true
      allowlist:
        description: "Comma-separated logins exempt from signing (bots, employees)"
        type: string
        required: true
      path-to-signatures:
        description: "Signature ledger path inside the calling repo"
        type: string
        default: 'assets/contributions-agreement/signatures/cla.json'
      branch:
        description: "Branch the signature ledger is committed to"
        type: string
        default: 'cla'
      runs-on:
        description: "Runner label for the check"
        type: string
        default: ubuntu-latest

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ${{ inputs.path-to-signatures }}
          path-to-document: ${{ inputs.path-to-document }}
          branch: ${{ inputs.branch }}
          allowlist: ${{ inputs.allowlist }}
