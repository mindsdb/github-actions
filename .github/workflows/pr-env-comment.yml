# Reusable workflow: post (and keep updating) one comment telling reviewers where
# a pull request's environment is.
#
# Every repo that deploys a PR environment wants this and only one had it, so the
# reviewer's first move on the other four was to reconstruct a hostname from a
# namespace convention or ask someone. The mechanism belongs here.
#
# IT CARRIES NO CREDENTIAL DETAIL. Not the password (obviously), but also not the
# account name, not the Secret and key holding the password, and not the command
# that reads it. That is a deliberate narrowing, and the reasoning is worth keeping
# because the convenience argument is seductive:
#
#   A `kubectl get secret` line grants nobody any capability. Anyone who can run it
#   can already read every Secret in that namespace. So it helps only the people who
#   least need help, and it pays for that by publishing the account name, the Secret
#   name, and the key into a permanent, org-wide, searchable surface — a free map of
#   what to grab, for whoever eventually gets cluster read.
#
# Credentials live in the access-controlled runbook, which is one place to update and
# one place to audit. This comment links it. `access-doc-url` is that link.
#
# THE FACTS STAY WITH THE CALLER. This repo is public and has to stay public (a
# public caller may only consume public reusable workflows, and cowork,
# cowork-server, and anton are public callers), so anything hard-coded here is
# world-readable. Hosts, namespace conventions, and the runbook link all arrive as
# INPUTS. A reusable that cannot be described without naming our infrastructure has
# not earned promotion and stays in the repo that owns it.
#
# On a PUBLIC repo, `access-doc-url` and `notes` are dropped: both describe internals
# by nature. `links` are NOT dropped, because only the caller knows what a link points
# at — an internal dev hostname is worth suppressing, a build artifact on a run that
# is already public in the Actions tab is not. Composing the links is the caller's
# job, so judging them is too.
#
# ON PERMISSIONS. The `comment` job DECLARES `pull-requests: write` rather than
# inheriting it, and that is deliberate after getting it wrong once: a job that
# declares nothing is invisible to the permission gate, so a caller that forgets the
# grant fails at RUN time with an opaque `HTTP 403` on the first `gh api` call
# instead of failing the lint. Declaring it means every caller must grant it, which
# is exactly the relationship the gate verifies.
#
# The consequence is that this workflow must be called from the pull-request pipeline
# DIRECTLY, not from a shared build-and-deploy reusable that push pipelines also
# call — otherwise those callers would have to grant a PR scope they never use, on
# the release path.

name: PR environment comment

on:
  workflow_call:
    inputs:
      env-name:
        description: "What this comment is about — an environment name, a build kind. Shown in the heading."
        type: string
        required: true
      heading:
        description: >-
          Heading text, with the env-name appended. Defaults to the per-PR
          environment wording; a caller posting something else (installer
          artifacts, say) supplies its own. Ignored when `status: absent`.
        type: string
        default: "PR environment is up"
      status:
        description: >-
          `up` when the environment exists, `absent` when it does not.

          Absent is a real state worth saying out loud rather than staying quiet.
          The namespace convention is documented, so someone WILL construct the URL
          for a PR that never got the label and land on a dead host; and because
          this comment rolls rather than reposting, one left behind after a teardown
          points at something that used to work. Saying "there is no environment,
          here is how to get one" answers both.
        type: string
        default: up
      deploy-label:
        description: "Label that creates the environment, named in the absent message."
        type: string
        default: deploy
      standard-links:
        description: >-
          Render the per-PR environment's full service table, derived from
          `env-name`.

          A PR environment is ONE namespace holding the whole stack — hub, auth,
          Keycloak, inference, cowork-server — whichever repo anchored it. So the
          table is a property of the environment, not of the repo, and every
          caller composing its own produced five near-identical tables that each
          listed only that repo's own service. Set false for a comment that is not
          about an environment (build artifacts, say).
        type: boolean
        default: true
      env-host-suffix:
        description: "Domain the per-PR hosts sit under."
        type: string
        default: dev.mindshub.ai
      default-tag:
        description: >-
          Image tag the services this PR does not build are running. Named in the
          comment so nobody assumes the whole namespace is their branch.
        type: string
        default: staging
      links:
        description: >-
          EXTRA links, appended after the standard table. JSON array of
          {"label","url"} objects. For genuinely repo-specific things — a Swagger
          path, a health endpoint — not for the service hosts, which are derived.
        type: string
        default: "[]"
      access-doc-url:
        description: >-
          Link to the runbook covering how to sign in: which account, and how to
          obtain its password.

          A LINK, and never the method. Anything that lets a reader obtain a
          credential is the credential, and a PR comment is a permanent, searchable,
          un-redactable place to put one. Keep the method behind whatever already
          guards it.
        type: string
        default: ""
      notes:
        description: "Markdown appended inside a collapsed <details>, for anything non-urgent."
        type: string
        default: ""
      marker:
        description: "HTML-comment key identifying this comment, so it rolls instead of piling up."
        type: string
        default: "pr-env-access"
      runs-on:
        description: "Runner label"
        type: string
        default: ubuntu-latest

defaults:
  run:
    shell: bash

jobs:
  comment:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: write # the rolling comment
    steps:
      - name: Post the environment details
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ENV_NAME: ${{ inputs.env-name }}
          LINKS: ${{ inputs.links }}
          STANDARD: ${{ inputs.standard-links }}
          HOST_SUFFIX: ${{ inputs.env-host-suffix }}
          DEFAULT_TAG: ${{ inputs.default-tag }}
          DOC_URL: ${{ inputs.access-doc-url }}
          NOTES: ${{ inputs.notes }}
          MARKER_KEY: ${{ inputs.marker }}
          HEADING: ${{ inputs.heading }}
          STATUS: ${{ inputs.status }}
          DEPLOY_LABEL: ${{ inputs.deploy-label }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          if [ -z "${PR:-}" ]; then
            echo "::error::No pull request in context; this workflow only makes sense on a pull_request run."
            exit 1
          fi

          # On a public repo, drop what describes internals by nature: the runbook
          # link and the free-text notes. NOT the links — an environment's own URL
          # is already published on this PR by the deployment entry in the sidebar,
          # so withholding it here hides it from the reviewer and from nobody else,
          # and it is the one thing the comment exists to say. Whether a link is
          # safe to publish is the caller's call, since only the caller knows what
          # it points at.
          #
          # Fail closed on an absent value: `private` is present on a pull_request
          # payload, and if it ever is not, the safe reading is "assume public".
          if [ "${IS_PRIVATE:-false}" != "true" ]; then
            DOC_URL=""
            NOTES=""
            echo "Public repository: omitting the runbook link and the notes."
          fi

          MARKER="<!-- ${MARKER_KEY} -->"
          {
            echo "${MARKER}"

            if [ "$STATUS" = "absent" ]; then
              # No `exit` here: this block is a redirect group, not a subshell, so
              # exiting would end the whole step and never post what it just wrote.
              echo "## No PR environment for this pull request"
              echo
              echo "Add the \`${DEPLOY_LABEL}\` label and push to create one. It is torn down when the label is removed or the PR closes, so any URL you saw here earlier is gone."
              echo
              echo "<sub>Updated on every push to this PR.</sub>"
            else

            echo "## ${HEADING} · \`${ENV_NAME}\`"
            echo

            # The whole stack lives in this one namespace, so list the whole
            # stack. Derived from the env name rather than passed in, because it
            # is identical for every anchor repo.
            ALL="${LINKS:-[]}"
            if [ "$STANDARD" = "true" ]; then
              ALL="$(jq -cn --arg e "$ENV_NAME" --arg d "$HOST_SUFFIX" --argjson extra "${LINKS:-[]}" '
                [ {label: "Console",   url: "https://\($e).\($d)"},
                  {label: "Auth API",        url: "https://auth-\($e).\($d)"},
                  {label: "Cowork Web",   url: "https://cowork-\($e).\($d)"} ]
                  {label: "Keycloak Admin",  url: "https://auth-\($e).\($d)/auth/admin/"},
                  {label: "Inference API",   url: "https://api-\($e).\($d)/v1"},
                  {label: "Cowork Server API",   url: "https://cowork-\($e).\($d)/api"} ]
                + $extra
                + [ {label: "Namespace", url: "`\($e)`"} ]')"
            fi

            if [ "$(jq 'length' <<< "$ALL")" != "0" ]; then
              echo "| | |"
              echo "| :--- | :--- |"
              jq -r '.[] | "| \(.label) | \(.url) |"' <<< "$ALL"
              echo
            fi

            if [ "$STANDARD" = "true" ]; then
              echo "Every service is in this namespace. The ones this PR does not build run the \`${DEFAULT_TAG}\` image unless you link them with \`Deploys:\` in the PR body."
              echo
            fi

            if [ -n "$DOC_URL" ]; then
              echo "**Signing in:** [how to get an account and its password](${DOC_URL}). Deliberately not in this comment — a PR comment is permanent and world-visible to the org."
              echo
            fi

            if [ -n "$NOTES" ]; then
              echo "<details><summary>More</summary>"
              echo
              echo "${NOTES}"
              echo
              echo "</details>"
              echo
            fi

            echo "<sub>Updated on every push to this PR.</sub>"
            fi
          } > body.md

          # One rolling comment per PR rather than a new one per push.
          # --paginate, because the default page holds 30 comments and a busy PR
          # would push the marker off it, making this post a duplicate on every
          # later push. The jq emits nothing for a page with no match rather than
          # an empty string: --paginate runs the filter per page and concatenates,
          # so a `// ""` fallback would prepend blank lines to the id.
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@body.md >/dev/null
          fi
