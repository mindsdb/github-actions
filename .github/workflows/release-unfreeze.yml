# Reusable workflow: unfreeze staging when the weekly release PR merges, then
# sync main back into staging.
#
# Unfreezing flips the pre-provisioned `staging-freeze` ruleset back to
# `disabled`, reopening staging for normal development the moment the release
# ships — no fixed Monday-morning wait.
#
# Order is load-bearing: unlock first, then push. If the sync-back push fails,
# staging is left unlocked, which is the acceptable failure mode.
#
# The sync-back merge (main -> staging) is load-bearing on squash-merge repos:
# without it, every previously shipped commit reappears in the next release
# PR's commit list. The push is performed with the `mindsdb-release-train` App
# token; the App is the ruleset bypass actor on staging, so the push lands even
# though staging otherwise requires review.
#
# Called by a per-repo wrapper, e.g.
#   cowork-server/.github/workflows/staging-unfreeze.yml
# The wrapper carries the merged-release-PR guard (head.ref == staging AND
# head.repo.full_name == the repo, to reject fork PRs). Keep the name
# "Staging Unfreeze".
#
# Requires: vars.RELEASE_APP_CLIENT_ID + secrets.RELEASE_APP_PRIVATE_KEY
# (org-provisioned; secret reaches here via `secrets: inherit`).

name: Staging Unfreeze

on:
  workflow_call:
    inputs:
      staging-branch:
        description: "Branch to unfreeze and sync into"
        type: string
        default: staging
      base-branch:
        description: "Production branch to sync back from"
        type: string
        default: main
      ruleset-name:
        description: "Name of the pre-provisioned freeze ruleset to toggle"
        type: string
        default: staging-freeze

permissions:
  contents: read

jobs:
  unfreeze-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-train App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Unfreeze staging (disable ruleset)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RULESET_NAME: ${{ inputs.ruleset-name }}
          STAGING: ${{ inputs.staging-branch }}
          ENFORCEMENT: disabled
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${REPO}/rulesets" \
            --jq ".[] | select(.name == \"${RULESET_NAME}\") | .id")
          if [ -z "$RID" ]; then
            echo "::error::Ruleset '${RULESET_NAME}' not found in ${REPO} — provisioning has drifted."
            exit 1
          fi
          # GET the full ruleset, flip only `enforcement`, PUT the whole body back
          # (partial PUT is not guaranteed to preserve omitted fields). Body goes to
          # a temp file, never echoed, so ruleset internals stay out of public logs.
          BODY="${RUNNER_TEMP}/ruleset-${RID}.json"
          gh api "repos/${REPO}/rulesets/${RID}" \
            --jq "{name, target, enforcement: \"${ENFORCEMENT}\", bypass_actors, conditions, rules}" > "$BODY"
          gh api --method PUT "repos/${REPO}/rulesets/${RID}" --input "$BODY" > /dev/null
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "Ruleset '${RULESET_NAME}' (#${RID}) enforcement set to ${ENFORCEMENT} — ${STAGING} is UNFROZEN."
          {
            echo "## Staging branch UNFROZEN"
            echo ""
            echo "The \`${STAGING}\` branch is **unfrozen** via ruleset \`${RULESET_NAME}\` (triggered by PR #${PR_NUMBER:-manual})."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the sync-back checkout carries credentials — it is the one step that
      # pushes.
      #
      # Runs on a manual dispatch too, which it did not used to. The old guard was
      # `github.event_name == 'pull_request'`, reasoned as "no PR merged, nothing
      # to sync", and that reasoning is wrong in the one case that matters: a
      # dispatch is what you reach for when the PR-triggered run could not run.
      # On 2026-07-27 auth's PR-triggered unfreeze died as a `startup_failure`
      # (an invalid caller, so zero jobs), the operator recovered with a dispatch,
      # and it unfroze staging while silently skipping the sync — leaving main
      # squash-merged into a `main` that `staging` did not contain, which had to be
      # merged by hand an hour later. The escape hatch was strictly less capable
      # than the path it exists to replace.
      #
      # Nothing needs the event to decide this: the sync step below already exits
      # 0 when `staging` is an ancestor of `main`, so a dispatch with genuinely
      # nothing to sync is a logged no-op rather than a wasted push.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync main back into staging
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STAGING: ${{ inputs.staging-branch }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail
          # Attribute the merge commit to the App's bot identity. The username is
          # URL-encoded (`[` -> %5B, `]` -> %5D) for the users API lookup.
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch origin "${BASE}" "${STAGING}"
          git checkout -B "${STAGING}" "origin/${STAGING}"
          if git merge-base --is-ancestor "origin/${BASE}" HEAD; then
            echo "${STAGING} already contains ${BASE} — nothing to sync."
            exit 0
          fi
          git merge --no-ff "origin/${BASE}" -m "Sync ${BASE} back into ${STAGING} after release"
          git push origin "HEAD:${STAGING}"
