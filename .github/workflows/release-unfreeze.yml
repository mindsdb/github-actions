# Reusable workflow: unfreeze staging when the weekly release PR merges, then
# sync main back into staging.
#
# Unfreezing sets this repo's `staging_frozen` custom property back to `false`,
# which takes the branch out of the org-level freeze ruleset and reopens staging
# for normal development the moment the release ships — no fixed Monday-morning
# wait. It is also what turns staging's alerting back off: the alert path reads
# the same property, so an unfrozen staging stops paging the channel without
# anything else being told.
#
# Order is load-bearing: unlock first, then push. If the sync-back push fails,
# staging is left unlocked, which is the acceptable failure mode.
#
# The sync-back merge (main -> staging) is load-bearing on squash-merge repos:
# without it, every previously shipped commit reappears in the next release
# PR's commit list. The push is performed with the `mindsdb-release-train` App
# token; the App is the freeze ruleset's bypass actor, so the push lands even
# though staging otherwise requires review.
#
# Called by a per-repo wrapper, e.g.
#   cowork-server/.github/workflows/staging-unfreeze.yml
# The wrapper carries the merged-release-PR guard (head.ref == staging AND
# head.repo.full_name == the repo, to reject fork PRs). Keep the name
# "Staging Unfreeze". The wrapper carries NO notify job: this workflow ends with
# one, so a re-run that fixes a failed unfreeze reports itself.
#
# Requires: vars.RELEASE_APP_CLIENT_ID + secrets.RELEASE_APP_PRIVATE_KEY
# (org-provisioned; secret reaches here via `secrets: inherit`).

name: Staging Unfreeze

on:
  workflow_call:
    inputs:
      staging-branch:
        description: "Branch to unfreeze and sync into"
        type: string
        default: staging
      base-branch:
        description: "Production branch to sync back from"
        type: string
        default: main
      freeze-property:
        description: "Custom property that marks this repo frozen. Must match the org ruleset's condition in terraform."
        type: string
        default: staging_frozen

# No workflow-level `permissions:` block, deliberately, so this job inherits the
# calling job's grant. That is what makes the notify step's recovery lookup work:
# a block here would be the CEILING for this job's token as well as the caller's,
# so declaring `contents: read` alone would cap the token to `contents: read` and
# the lookup would be refused no matter what the caller granted. Declaring
# `actions: read` instead is not an option either — every caller that has not yet
# granted it would fail to LOAD, and these wrappers reach a repo's default branch
# only at the next weekly release, so the two can never merge in step. Inheriting
# gives both: the grant where a caller has it, and a refused lookup that logs why
# and stays quiet where it does not.
#
# The cost is real and worth naming: `scripts/workflow_graph.py` check 2 compares
# what a callee DECLARES against what its callers grant, so a job that declares
# nothing is invisible to it. That check cannot help here.

jobs:
  unfreeze-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-train App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The property write lives in `scripts/freeze_state.py`, which is also what
      # the alerting workflows use to READ the freeze state. One file owns the
      # contract, so unfreezing and "staging alerts are off again" can never
      # disagree about which property they mean.
      #
      # This has to precede the unlock, because the unlock runs that script. It is
      # therefore the one step whose failure leaves staging FROZEN, which is the
      # bad direction — so it is also the only one, and the credentialed checkout
      # that used to sit here moved below the unlock where it belongs.
      - name: Check out the shared release-freeze contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mindsdb/github-actions
          ref: ${{ job.workflow_sha }}
          path: .ci-shared
          persist-credentials: false

      - name: Unfreeze staging (clear the frozen property)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FREEZE_PROPERTY: ${{ inputs.freeze-property }}
          STAGING: ${{ inputs.staging-branch }}
          FROZEN: "false"
        run: |
          set -euo pipefail
          python3 .ci-shared/scripts/freeze_state.py set \
            --repo "${REPO}" \
            --property-name "${FREEZE_PROPERTY}" \
            --frozen "${FROZEN}" \
            --body-path "${RUNNER_TEMP}/freeze-property.json"
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "${STAGING} is UNFROZEN."
          {
            echo "## Staging branch UNFROZEN"
            echo ""
            echo "The \`${STAGING}\` branch is **unfrozen**: \`${FREEZE_PROPERTY}=false\` (triggered by PR #${PR_NUMBER:-manual})."
          } >> "$GITHUB_STEP_SUMMARY"

      # Order is load-bearing and this is the whole reason for it: unlock first,
      # then push. If anything from here down fails, staging is left UNLOCKED,
      # which is the acceptable direction. Checking out is not a push, but it can
      # still fail, so it sits after the unlock rather than before it.
      #
      # `path:` keeps it out of the workspace root, so it cannot clean the shared
      # checkout above back out and the order is free rather than a constraint.
      #
      # The sync step runs on a manual dispatch too, which it did not used to. The
      # old guard was `github.event_name == 'pull_request'`, reasoned as "no PR
      # merged, nothing to sync", and that reasoning is wrong in the one case that
      # matters: a dispatch is what you reach for when the PR-triggered run could
      # not run. On 2026-07-27 auth's PR-triggered unfreeze died as a
      # `startup_failure` (an invalid caller, so zero jobs), the operator recovered
      # with a dispatch, and it unfroze staging while silently skipping the sync —
      # leaving main squash-merged into a `main` that `staging` did not contain,
      # which had to be merged by hand an hour later. The escape hatch was strictly
      # less capable than the path it exists to replace.
      #
      # Nothing needs the event to decide this: the sync step below already exits 0
      # when `staging` is an ancestor of `main`, so a dispatch with genuinely
      # nothing to sync is a logged no-op rather than a wasted push.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          path: repo

      - name: Sync main back into staging
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STAGING: ${{ inputs.staging-branch }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail
          # Attribute the merge commit to the App's bot identity. The username is
          # URL-encoded (`[` -> %5B, `]` -> %5D) for the users API lookup.
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git fetch origin "${BASE}" "${STAGING}"
          git checkout -B "${STAGING}" "origin/${STAGING}"
          if git merge-base --is-ancestor "origin/${BASE}" HEAD; then
            echo "${STAGING} already contains ${BASE} — nothing to sync."
            exit 0
          fi
          git merge --no-ff "origin/${BASE}" -m "Sync ${BASE} back into ${STAGING} after release"
          git push origin "HEAD:${STAGING}"

      # The alert lives here rather than in each repo's wrapper, which is what
      # made every wrapper `if: failure()` and therefore incapable of ever saying
      # a failure had been FIXED. Ending the job with this step covers both
      # directions in one place for all seven consumers.
      # `continue-on-error` because the alert must never decide the job's fate. It
      # runs under `always()` on green runs too now, and the Slack action calls
      # `core.setFailed` on any Slack-side error, so without this a rotated bot
      # token or a bot removed from the channel would report a successful unfreeze
      # as a failure.
      - name: Notify the engineering channel
        if: ${{ always() && job.status != 'cancelled' }}
        continue-on-error: true
        uses: ./.ci-shared/notify-pipeline-status
        with:
          env-name: "staging unfreeze"
          status: ${{ job.status == 'failure' && 'failed' || 'recovered' }}
          github-token: ${{ github.token }}
          slack-channel-id: ${{ secrets.SLACK_ENG_CHANNEL_ID }}
          slack-bot-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
