# Reusable workflow: lint the CALLING repo's GitHub Actions workflows.
#
# One place for the checks every service repo wants on its own pipelines, so they
# are not eight copies of a lint step drifting apart. Three layers, deliberately
# in this order, because they catch different things and only two of them are ours
# to maintain:
#
#   actionlint   The established syntax + expression + shellcheck linter. Blocking.
#                Everything it finds is a mistake.
#   permissions  The one check neither tool does: a called workflow may never
#                declare a permission its caller lacks. Blocking. See
#                scripts/workflow_graph.py for why this is not redundant —
#                short version, it was verified against a real tree that had
#                already broken a deploy branch, and neither tool said a word.
#   zizmor       The established Actions SECURITY auditor (template injection,
#                credential persistence, unpinned actions, excessive permissions).
#                Advisory by default, because pointing it at existing pipelines
#                surfaces a backlog, and a lint job that is red on arrival gets
#                ignored rather than fixed. Flip `zizmor-blocking` per repo once
#                its backlog is triaged — same rollout the pip-audit gate used.
#
# Nothing here is hand-rolled that a tool already does. The permission check is
# ~200 lines precisely because it is the only gap.
#
# Runner: defaults to ubuntu-latest. This job needs no cluster, no cloud, and no
# secrets, so it should not occupy a self-hosted runner, and it is safe on a
# public repo's fork PRs.

name: Workflow lint

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: "actionlint release to run"
        type: string
        default: "1.7.12"
      zizmor-version:
        description: "zizmor release to run"
        type: string
        default: "1.28.0"
      zizmor-blocking:
        description: "Fail the job on zizmor findings (off until a repo's backlog is triaged)"
        type: boolean
        default: false
      zizmor-persona:
        description: "zizmor strictness (regular | pedantic | auditor)"
        type: string
        default: regular
      default-permissions:
        description: >-
          What an undeclared workflow token carries in the calling repo, from
          Settings -> Actions -> Workflow permissions (read | write). The
          permission check compares against it, so a repo set to write needs to
          say so or the check is stricter than reality.
        type: string
        default: read
      runs-on:
        description: "Runner label"
        type: string
        default: ubuntu-latest

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out the calling repo
        uses: actions/checkout@v5

      - name: Check out the shared CI scripts
        uses: actions/checkout@v5
        with:
          repository: mindsdb/github-actions
          path: .ci-shared

      # Downloaded rather than run through a third-party action: one fewer
      # mutable-tag dependency in the job that exists to police them.
      - name: Run actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check that every reusable call composes
        env:
          DEFAULTS: ${{ inputs.default-permissions }}
        run: |
          set -euo pipefail
          # --no-project because this runs inside the CALLING repo. Without it
          # `uv run` discovers that repo's pyproject.toml, builds a .venv and
          # installs its entire dependency tree before running a script that only
          # needs pyyaml. That is slow, and it fails outright when a caller depends
          # on a private git repo, since this job holds no credentials for one.
          uv run --no-project --with pyyaml --python 3.12 \
            .ci-shared/scripts/workflow_graph.py \
            --workflow-dir .github/workflows \
            --default-permissions "$DEFAULTS"

      # Not a tool, just a rule, because the failure it prevents is permanent.
      # A cluster Secret read by hand is unmasked until someone remembers
      # `::add-mask::`, and `::add-mask::` only scrubs output that comes AFTER it,
      # so the correct-looking fetch-then-mask still has a window. The k8s-secret
      # composite action closes it by construction (fetch, fail-if-empty, mask,
      # export, in that order). A credential printed into an Actions log is
      # world-readable to the org and unrevocable from there — you can rotate the
      # secret, you cannot unpublish the log.
      #
      # A workflow that genuinely needs the raw form, or that only quotes the
      # command for a human to run, exempts itself with a `k8s-secret-ok: <reason>`
      # comment anywhere in the file. Per FILE rather than per line, because the
      # one real exemption we have is a command inside a heredoc that gets posted
      # to a PR, and a per-line marker there would be published along with it.
      - name: Check for hand-rolled cluster secret reads
        run: |
          set -uo pipefail
          FOUND=0
          while IFS= read -r file; do
            grep -q 'k8s-secret-ok:' "$file" && continue
            # Comment lines are skipped: this rule is about a read that EXECUTES,
            # and a workflow explaining the rule should not trip it. (It did, on
            # the first repo that documented why its comment carries no secrets.)
            # A commented-out read cannot leak anything until someone uncomments
            # it, at which point this fires.
            if grep -nE '^[[:space:]]*[^#[:space:]].*kubectl.*get[[:space:]]+secret' "$file"; then
              echo "  ^ in $file"
              FOUND=1
            fi
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          if [ "$FOUND" = "1" ]; then
            echo "::error::Read cluster secrets through mindsdb/github-actions/k8s-secret@main, which fails on an absent key and masks BEFORE exporting. ::add-mask:: only scrubs output that comes after it, so a hand-rolled fetch-then-mask still has a window, and a credential in an Actions log cannot be unpublished."
            echo "If a file only quotes the command for a human, add a 'k8s-secret-ok: <reason>' comment to it."
            exit 1
          fi
          echo "No hand-rolled cluster secret reads."

      - name: Audit workflows with zizmor
        env:
          VERSION: ${{ inputs.zizmor-version }}
          PERSONA: ${{ inputs.zizmor-persona }}
          BLOCKING: ${{ inputs.zizmor-blocking }}
          # zizmor's online audits resolve action references against the API; the
          # default token is enough and keeps it off the anonymous rate limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The shared policy travels with the scripts, so every repo audits under
          # the same rules and a decision recorded once is not re-litigated per
          # repo. A repo with its own .github/zizmor.yml still wins, since zizmor
          # prefers a repo-local config over --config.
          CFG=(--config .ci-shared/zizmor.yml)
          [ -f .github/zizmor.yml ] && CFG=()

          if [ "$BLOCKING" = "true" ]; then
            uvx "zizmor@${VERSION}" "${CFG[@]}" --persona="$PERSONA" .github/workflows
            exit 0
          fi

          # Advisory: report and move on. Turning this into a gate later is a
          # one-line input change on the caller rather than a discovery exercise.
          uvx "zizmor@${VERSION}" "${CFG[@]}" --persona="$PERSONA" .github/workflows | tee zizmor.out || true
          uvx "zizmor@${VERSION}" "${CFG[@]}" --persona="$PERSONA" --format json .github/workflows > zizmor.json 2>/dev/null || true

          # A count per rule, not a `tail -40`. An advisory backlog is a hundred
          # findings from a handful of rules, and the arbitrary last-40-lines
          # window showed neither how big it was nor what it consisted of — just
          # whichever three findings happened to sort last. What a reader needs
          # first is which rules are firing and how much each one owes, and only
          # then the raw output, which is why that goes in a <details>.
          {
            echo "### zizmor (advisory)"
            echo
            if [ -s zizmor.json ] && jq -e 'type == "array"' zizmor.json > /dev/null 2>&1; then
              echo "| rule | severity | count |"
              echo "|---|---|---:|"
              jq -r 'group_by(.ident + .determinations.severity)
                     | map({rule: .[0].ident, sev: .[0].determinations.severity, n: length})
                     | sort_by(-.n)[]
                     | "| [\(.rule)](https://docs.zizmor.sh/audits/#\(.rule)) | \(.sev) | \(.n) |"' zizmor.json
              echo
              echo "**$(jq 'length' zizmor.json) reported.**"
            else
              echo "_(no machine-readable output; see the log)_"
            fi
            echo
            echo "<details><summary>Full zizmor output</summary>"
            echo
            echo '```'
            cat zizmor.out
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Set \`zizmor-blocking: true\` on the caller once these are triaged."
          } >> "$GITHUB_STEP_SUMMARY"
