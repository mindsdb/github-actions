# Reusable workflow: merge `main` back into `staging` after ANY push to main.
#
# `release-unfreeze.yml` already syncs main into staging when the weekly release
# PR merges. That covers the release path and nothing else. A commit that reaches
# main any other way — a hotfix PR, a revert, a direct merge — fires no unfreeze
# (the wrapper's guard requires the merged PR's head to be `staging`), so it sits
# on main until the NEXT weekly release drags it across, up to a week later.
#
# That gap is not cosmetic on squash-merge repos. While main is ahead, the next
# release PR's diff is computed against a main that staging does not contain, so
# the release either reverts the missing commit or has to be reconciled by hand.
# This workflow closes the window: main flows into staging within a minute of
# landing, whatever route it took.
#
# Idempotent by construction: it exits 0 when staging already contains main, so
# it is safe to run on every push, and safe to run alongside the unfreeze sync.
#
# Ordering against release-unfreeze: merging the release PR fires BOTH this
# (push to main) and the unfreeze (pull_request closed). Both push staging with
# the same App, so the CALLER must put both workflows in one `concurrency` group
# to serialise them; the loser then finds staging already current and no-ops.
# The push also retries once on a non-fast-forward, which covers a staging that
# moved between fetch and push for any other reason.
#
# The push uses the `mindsdb-release-train` App token. The App is the ruleset
# bypass actor on staging, so it lands even while staging is frozen — which is
# what you want: a hotfix on main belongs in the release candidate too.
#
# Called by a per-repo wrapper, e.g.
#   auth/.github/workflows/sync-main-to-staging.yml
# The wrapper carries NO notify job: this workflow ends with one. The wrappers
# used to own it, written `if: failure()`, which meant a sync could report that
# it broke and never that it was fixed. On 2026-08-14 cowork's sync failed and
# alerted, the re-run succeeded, and the notify job was SKIPPED, leaving the
# channel holding a red alert for a sync that had already recovered.
#
# Requires: vars.RELEASE_APP_CLIENT_ID + secrets.RELEASE_APP_PRIVATE_KEY
# (org-provisioned; secret reaches here via `secrets: inherit`).

name: Sync main to staging

on:
  workflow_call:
    inputs:
      staging-branch:
        description: "Branch to sync into"
        type: string
        default: staging
      base-branch:
        description: "Production branch to sync from"
        type: string
        default: main
      runs-on:
        description: "Runner label"
        type: string
        default: ubuntu-latest

# No workflow-level `permissions:` block, deliberately, so this job inherits the
# calling job's grant. That is what makes the notify step's recovery lookup work:
# a block here would be the CEILING for this job's token as well as the caller's,
# so declaring `contents: read` alone would cap the token to `contents: read` and
# the lookup would be refused no matter what the caller granted. Declaring
# `actions: read` instead is not an option either — every caller that has not yet
# granted it would fail to LOAD, and these wrappers reach a repo's default branch
# only at the next weekly release, so the two can never merge in step. Inheriting
# gives both: the grant where a caller has it, and a refused lookup that logs why
# and stays quiet where it does not.
#
# The cost is real and worth naming: `scripts/workflow_graph.py` check 2 compares
# what a callee DECLARES against what its callers grant, so a job that declares
# nothing is invisible to it. That check cannot help here.

jobs:
  sync:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Mint release-train App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # After the checkout above, which would otherwise clean this back out of
      # the workspace.
      - name: Check out the shared alert implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mindsdb/github-actions
          ref: ${{ job.workflow_sha }}
          path: .ci-shared
          persist-credentials: false

      - name: Sync base branch into staging
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STAGING: ${{ inputs.staging-branch }}
          BASE: ${{ inputs.base-branch }}
        run: |
          set -euo pipefail

          # Attribute the merge commit to the App's bot identity. The username is
          # URL-encoded ('[' -> %5B, ']' -> %5D) for the users API lookup.
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # One attempt, then one retry: the retry exists for the case where
          # staging moved after the fetch (a concurrent sync, or an ordinary push
          # landing while staging is unfrozen), which shows up as a rejected
          # non-fast-forward rather than an error worth failing the run over.
          for attempt in 1 2; do
            git fetch origin "${BASE}" "${STAGING}"
            git checkout -B "${STAGING}" "origin/${STAGING}"

            if git merge-base --is-ancestor "origin/${BASE}" HEAD; then
              echo "${STAGING} already contains ${BASE} — nothing to sync."
              exit 0
            fi

            git merge --no-ff "origin/${BASE}" \
              -m "Sync ${BASE} into ${STAGING}"

            if git push origin "HEAD:${STAGING}"; then
              echo "Pushed ${BASE} -> ${STAGING} on attempt ${attempt}."
              {
                echo "## Synced \`${BASE}\` into \`${STAGING}\`"
                echo ""
                echo "\`${STAGING}\` now contains every commit on \`${BASE}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Push rejected on attempt ${attempt} — ${STAGING} moved underneath us."
            git merge --abort 2>/dev/null || true
          done

          echo "::error::Could not fast-forward ${STAGING} after 2 attempts. ${STAGING} is moving faster than this workflow can merge, or the App lost its bypass on ${STAGING}."
          exit 1

      # `continue-on-error` because the alert must never decide the job's fate. It
      # runs under `always()` on green runs too now, and the Slack action calls
      # `core.setFailed` on any Slack-side error, so without this a rotated bot
      # token or a bot removed from the channel would report a successful run as a
      # failure — and for the freeze that also skips the release-PR refresh, which
      # gates on this run's conclusion.
      - name: Notify the engineering channel
        if: ${{ always() && job.status != 'cancelled' }}
        continue-on-error: true
        uses: ./.ci-shared/notify-pipeline-status
        with:
          env-name: "main -> staging sync"
          status: ${{ job.status == 'failure' && 'failed' || 'recovered' }}
          github-token: ${{ github.token }}
          slack-channel-id: ${{ secrets.SLACK_ENG_CHANNEL_ID }}
          slack-bot-token: ${{ secrets.GH_ACTIONS_SLACK_BOT_TOKEN }}
