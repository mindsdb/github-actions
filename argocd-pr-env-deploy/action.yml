# Deploy the anchor PR's environment: resolve what it deploys, commit that to
# mindsdb/argocd-state, and wait for Argo CD to report back.
#
# Resolves:
#   - This PR (anchor) — own merge SHA (image built in this same run), repo
#     short name from $GITHUB_REPOSITORY.
#   - Any `Deploys: repo#N` or `Deploys: org/repo#N` line in the anchor PR
#     body (owner defaults to this repo's org) — looks up each linked PR's
#     head + merge SHAs via the GitHub REST API.
#   - `Deploys: repo#staging` — no API lookup; pins that repo to the
#     `staging` ECR image tag + `staging` git branch. Useful for testing
#     the anchor PR against non-PR-branch versions of a sibling service.
#   - `Deploys: repo#main`: same, pinned to the `production` ECR image tag
#     + `main` git branch.
#   - `Deploys: mindshub_services#N` sets `revisions.mindshub_services` only.
#     That repo ships a SAM stack, not an image: its pr-env-stacks workflow
#     reads the revision off the environment's file and deploys it, so there
#     is no ECR tag to check and no `tags.<repo>` to set.
#   - The staff console is opt-in. A mindshub_stafftools anchor PR, or any
#     `Deploys: mindshub_stafftools#...` line, sets its tag and revision, and
#     the parent renders it only while both are set. The file's `tags` and
#     `revisions` are replaced whole on every deploy, so removing the line
#     turns the console off on the next deploy, and a removed link of any
#     kind drops its pin.
#   - `Deploys: argocd-envs#N` is refused, with a comment: the parent chart's
#     branch is an `argocd-envs:<branch>` label on the PR, which the
#     pr-environments ApplicationSet reads itself.
#   - A PR labeled `customer:<hostBase>` is refused. A customer environment's
#     file in argocd-state is written by hand, in a reviewed PR there.
#
# Linked-PR image tags resolve in order:
#   1. `development-head-<head sha>` — pushed by build-push-ecr's PR
#      dual-tag. Head SHAs are immutable, so this pin can't go stale.
#   2. `development-<merge sha>` — back-compat with images built before
#      dual-tagging. GitHub regenerates the synthetic merge SHA whenever
#      base or head moves, so resolving it at deploy time can name a twin
#      commit no build ever pushed.
#   3. Neither exists in ECR → the job fails loudly with a fix (re-run the
#      linked repo's pipeline), instead of pinning a phantom tag and leaving
#      the env in ImagePullBackOff silently.
# Every pinned tag — the anchor's own included — is existence-checked
# against ECR (`aws ecr describe-images`; GitHub short name maps to the
# `mindsdb-<name-with-hyphens>` ECR repo). The calling job assumes the ECR
# push role first (`ECR_PUSH_ROLE_ARN`, whose policy includes DescribeImages);
# a hosted runner has no credentials of its own. Only Image/RepositoryNotFound
# count as absent; if the aws CLI is missing or errors for infra reasons
# (auth, throttle, network) the checks are skipped with one warning rather
# than blocking a deploy that would have worked.
#
# `Deploys:`-looking body lines that don't match the accepted forms (e.g. a
# pasted PR URL) emit a ::warning:: instead of being silently ignored.
#
# Then it writes `pr-envs/pr-<anchor>-<num>.yaml` in argocd-state
# (scripts/write_pr_env_state.py, retried when another deploy lands first)
# and sets commit status `argocd/pr-env` to pending on the PR's head commit.
# The parent Application reads that file as its values; Argo CD's
# notifications controller flips the status to success once the parent has
# synced and every child is healthy, or to failure when the sync fails or
# times out (Kubernetes-Foundational-Services, argo-cd chart). The step waits
# on the status (`wait-timeout`, 30m default) so the job stays open until the
# env is actually up, and the integration tests after it run against it.
# Nothing here talks to Argo CD, so this runs on ubuntu-latest.
#
# A re-run of the same commit with nothing changed pushes nothing and reads
# the status Argo CD last set. To deploy again, push a commit; to sync again
# without one, press Sync on the parent in Argo CD (argo.dev.mindsdb.com,
# over the VPN).
#
# Must run from a `pull_request` event; PR number and head SHA are read from
# $GITHUB_EVENT_PATH so callers don't have to pass them.
#
# Requires `curl`, `jq` and python3 with PyYAML on the runner (ubuntu-latest
# has all three). Does NOT require `gh`.
name: ArgoCD Deploy (PR env)
description: Record the PR's own and linked image tags in argocd-state and wait for Argo CD to deploy them.

inputs:
  state-token:
    description: An installation token for mindsdb-release-train with contents write on argocd-state.
    required: true
  gh-token:
    description: GitHub PAT used to query cross-referenced PRs' head SHAs.
    required: true
  state-repository:
    description: The state repository.
    required: false
    default: mindsdb/argocd-state
  state-branch:
    description: The branch Argo CD reads.
    required: false
    default: main
  status-token:
    description: A token that may write commit statuses on the calling repository.
    required: false
    default: ${{ github.token }}
  argocd-url:
    description: The Argo CD that deploys the environment, for the status link.
    required: false
    default: https://argo.dev.mindsdb.com
  stacks-dispatch-token:
    description: >-
      Token used to dispatch mindshub_services' pr-env-stacks.yml for this env
      (needs `actions: write` there). Defaults to gh-token. The dispatch is
      best-effort: on failure the reconciler's schedule picks the env up.
    required: false
    default: ""
  wait-timeout:
    description: >-
      Seconds to wait for Argo CD to report the env Synced+Healthy before
      failing. Covers a cold env's image pulls and migrations, so lower it only
      if you know this repo's envs come up faster. Argo CD itself fails a sync
      after 30 minutes.
    required: false
    default: "1800"

runs:
  using: composite
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        repository: ${{ inputs.state-repository }}
        ref: ${{ inputs.state-branch }}
        token: ${{ inputs.state-token }}
        path: argocd-state
        persist-credentials: true

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        STATUS_TOKEN: ${{ inputs.status-token }}
        STATE_BRANCH: ${{ inputs.state-branch }}
        ARGOCD_URL: ${{ inputs.argocd-url }}
        STACKS_DISPATCH_TOKEN: ${{ inputs.stacks-dispatch-token || inputs.gh-token }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Fail fast on an empty token: a missing secret reads as "".
        : "${GH_TOKEN:?GH_TOKEN is empty — pass GH_PRIVATE_ACCESS_TOKEN via the gh-token input}"

        OWN_REPO="$GITHUB_REPOSITORY"
        OWN_SHORT="${OWN_REPO##*/}"
        # Slugified form for K8s resource names + labels. RFC 1123 forbids
        # underscores in Application names / Namespaces / hostnames, but
        # `mindshub_frontend` is the canonical GitHub repo name and stays
        # underscored everywhere it identifies the repo (helm parameter
        # keys, the `Deploys:` regex, ECR image tags).
        OWN_SLUG="${OWN_SHORT//_/-}"
        PR_NUMBER="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"

        # Two SHAs, used for two different things:
        #   $GITHUB_SHA              = merge SHA (PR head merged into base, a
        #                              synthetic commit only reachable via
        #                              refs/pull/N/merge). build-push-ecr tags
        #                              images as `development-${GITHUB_SHA}`,
        #                              so the image-tag override uses this.
        #   .pull_request.head.sha   = PR branch tip — the commit ArgoCD's
        #                              repo-server can actually fetch as a
        #                              `targetRevision`. Used for the chart
        #                              revision so chart changes on the PR
        #                              branch deploy with the PR.
        OWN_MERGE_SHA="$GITHUB_SHA"
        OWN_HEAD_SHA="$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
        PARENT_APP="pr-${OWN_SLUG}-${PR_NUMBER}"

        # GitHub REST helper — auth + sensible headers in one place. No `gh`
        # dependency: self-hosted runners may not have it.
        gh_api() {
          curl -sfH "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com$1"
        }

        # ECR image-existence guard. Maps a GitHub repo short name to its
        # ECR repository (`mindsdb-` + short name, underscores to hyphens)
        # and asks ECR whether <tag> exists. Returns 0 = present, 1 = absent.
        # Only ImageNotFoundException / RepositoryNotFoundException count as
        # absent; any other failure (no aws CLI, auth, throttle, network)
        # must never brick a deploy that would have worked — warn ONCE,
        # remember ECR is unusable, and report every tag as present from
        # then on.
        ECR_CHECKS=on
        ecr_repo_name() {
          # anton's worker image is published under this name, not
          # `mindsdb-anton`.
          case "$1" in
            anton) echo "minds-anton-scratchpad" ;;
            *) echo "mindsdb-${1//_/-}" ;;
          esac
        }
        ecr_tag_exists() {
          local ecr_repo tag="$2" err
          ecr_repo="$(ecr_repo_name "$1")"
          [ "$ECR_CHECKS" = on ] || return 0
          if ! command -v aws >/dev/null 2>&1; then
            ECR_CHECKS=off
            echo "::warning::aws CLI not found on this runner — ECR image-existence checks skipped, tags assumed present."
            return 0
          fi
          if err="$(aws ecr describe-images \
                      --repository-name "$ecr_repo" \
                      --image-ids "imageTag=${tag}" \
                      --region "${AWS_REGION:-us-east-1}" 2>&1 >/dev/null)"; then
            return 0
          fi
          case "$err" in
            *ImageNotFoundException*|*RepositoryNotFoundException*)
              return 1
              ;;
            *)
              ECR_CHECKS=off
              echo "::warning::ECR describe-images failed (${err//$'\n'/ }) — image-existence checks skipped, tags assumed present."
              return 0
              ;;
          esac
        }

        # Fetch the PR body ONCE — the strict `Deploys:` extraction and the
        # lint below both reuse it. Strip \r so CRLF bodies don't trip the
        # line-anchored lint pattern. Fail with a diagnosable message rather
        # than letting `set -e` kill the step mutely on an API blip.
        PR_JSON="$(gh_api "/repos/$OWN_REPO/pulls/$PR_NUMBER")" && jq -e 'type == "object"' <<<"$PR_JSON" >/dev/null || {
          echo "::error::Could not fetch PR #${PR_NUMBER} body from the GitHub API (needed to resolve Deploys: links) — transient API failure or bad GH_TOKEN. Re-run the job."
          exit 1
        }
        PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON" | tr -d '\r')"
        LABEL_HOST="$(jq -r '[.labels[].name | select(startswith("customer:")) | ltrimstr("customer:")] | first // ""' <<<"$PR_JSON")"

        # A customer environment's file is written by hand, in a reviewed PR
        # to argocd-state, never by CI.
        if [ -n "$LABEL_HOST" ]; then
          echo "::error::Refusing to deploy: this PR carries the customer:${LABEL_HOST} label. A customer environment's file, pr-envs/${PARENT_APP}.yaml in argocd-state, is written by hand in a PR there."
          exit 1
        fi

        # Lint: `Deploys:`-looking lines that don't match the strict form
        # would otherwise be silently ignored and the env would quietly run
        # defaults — the classic offender is a pasted PR URL. Warn per line.
        while IFS= read -r line; do
          if ! printf '%s\n' "$line" | grep -qE 'Deploys:[[:space:]]+[^#[:space:]]+#([0-9]+|staging|main)'; then
            echo "::warning::Ignoring unrecognised Deploys line: '${line}'. Accepted forms: 'Deploys: repo#N', 'Deploys: org/repo#N', 'Deploys: repo#staging', 'Deploys: repo#main' (PR URLs are not parsed)."
          fi
        done < <(printf '%s\n' "$PR_BODY" | grep -iE '^[[:space:]]*deploys?:' || true)

        # Build the override list — for each known PR (own + every linked
        # one) we emit two helm-set args:
        #   tags.<repo>=<image tag>      resolved per the header's order
        #   revisions.<repo>=<head-sha>  chart git revision (ArgoCD fetches
        #                                the chart at this commit; pr-branch
        #                                chart changes deploy with the PR)
        # Links accept `Deploys: repo#N` (owner defaults to this repo's
        # org), `Deploys: org/repo#N`, or `Deploys: repo#staging` (pin the
        # linked repo to that env's moving image tag + `staging` branch —
        # no API lookup, both values reused verbatim from that env's
        # release pipeline). Self-links are skipped; an unresolvable link
        # (missing/closed/unmergeable PR) fails the job and comments on the
        # anchor PR rather than silently deploying from the default branch.
        #
        # The anchor's own image is tagged from the merge SHA by the build
        # job in this same run — no cross-PR race — but it still gets the
        # existence check so a failed/skipped build fails HERE, not as an
        # ImagePullBackOff in the env.
        # Repos that publish no image. Their deploy is the git revision alone:
        # mindshub_services' pr-env-stacks workflow builds a SAM stack from
        # revisions.mindshub_services. Applies to the anchor itself and to
        # `Deploys:` links (the revision-only case below).
        is_revision_only_repo() {
          case "$1" in
            mindshub_services) return 0 ;;
            *) return 1 ;;
          esac
        }

        # The staff console is opt-in: the parent renders it only while both
        # tags.mindshub_stafftools and revisions.mindshub_stafftools are set.
        # It is selected when this run sets its revision: a mindshub_stafftools
        # anchor, or a `Deploys: mindshub_stafftools#...` line the link loop
        # below resolved. Nothing switches it off by hand: the writer replaces
        # the file's maps with this run's, so an unselected console has no
        # keys. Kept for the tests that pin which lines select it.
        staff_console_selected() {
          local arg
          for arg in "${set_args[@]}"; do
            case "$arg" in
              revisions.mindshub_stafftools=*) return 0 ;;
            esac
          done
          return 1
        }
        if is_revision_only_repo "$OWN_SHORT"; then
          set_args=(--helm-set "revisions.${OWN_SHORT}=${OWN_HEAD_SHA}")
        else
          OWN_TAG="development-${OWN_MERGE_SHA}"
          if ! ecr_tag_exists "$OWN_SHORT" "$OWN_TAG"; then
            echo "::error::ECR image $(ecr_repo_name "$OWN_SHORT"):${OWN_TAG} not found. Did the build job in this run succeed?"
            exit 1
          fi
          set_args=(
            --helm-set "tags.${OWN_SHORT}=${OWN_TAG}"
            --helm-set "revisions.${OWN_SHORT}=${OWN_HEAD_SHA}"
          )
        fi

        # Linked PRs resolve in two phases. Phase 1 (inside the process
        # substitution): parse the body + hit the GitHub API, emitting one
        # colon-delimited line per link — colons are safe, SHAs and repo
        # names never contain them. Phase 2 (the while loop, which runs in
        # the MAIN shell): pick an image tag via the ECR guard and abort
        # when nothing exists. The split matters: `exit 1` inside `< <(...)`
        # only kills that subshell, so the existence checks and the abort
        # must live out here where exit actually terminates the step (and
        # where the guard's warn-once cache persists across iterations).
        unresolved_links=()
        envs_links=()
        while IFS=: read -r kind link repo merge_sha head_sha branch; do
          case "$kind" in
            unresolved)
              # Linked PR could not be resolved (missing/closed/unmergeable;
              # see phase 1). Collect for a single blocking comment + failure
              # after the loop, in the main shell where exit actually works.
              unresolved_links+=("$link")
              ;;
            line)
              # `repo#staging` / `repo#main`: the branch field carries which.
              # Repos without an image take the chart branch alone.
              if is_revision_only_repo "$repo"; then
                set_args+=(--helm-set "revisions.${repo}=${branch}")
                continue
              fi
              case "$branch" in
                staging) tag=staging ;;
                main)    tag=production ;;
              esac
              # Not every repo publishes both moving tags (cowork has no
              # `production`), so check before pinning: an absent tag leaves
              # the child in ImagePullBackOff until wait-timeout expires.
              if [ "$ECR_CHECKS" = on ] && ! ecr_tag_exists "$repo" "$tag"; then
                echo "::error::No ECR image $(ecr_repo_name "$repo"):${tag} for ${link}. That repo does not publish a '${tag}' tag; link a PR number or the other branch instead."
                exit 1
              fi
              set_args+=(
                --helm-set "tags.${repo}=${tag}"
                --helm-set "revisions.${repo}=${branch}"
              )
              ;;
            revision-only)
              # No image to pin or check; the revision is the whole deploy.
              set_args+=(--helm-set "revisions.${repo}=${head_sha}")
              ;;
            envs)
              # The parent chart itself is not deployed from here any more:
              # its branch is a label the ApplicationSet reads. Collected for
              # one comment after the loop, where exit works.
              envs_links+=("$link")
              ;;
            pr)
              # Prefer the head-SHA tag: PR head SHAs are immutable, so the
              # pin can't go stale. Fall back to the merge-SHA tag for
              # images built before dual-tagging — GitHub regenerates the
              # synthetic merge SHA whenever base or head moves, so this
              # deploy-time lookup can name a twin commit no build ever
              # pushed; the guard catches exactly that case.
              #
              # The head tag is selected ONLY on a positive ECR check. When
              # the guard is unavailable (no aws CLI / AccessDenied / any
              # infra error — including one that strikes mid-check and
              # fabricates a "present" answer), degrade to the merge tag:
              # exactly the pre-hardening behavior, never worse. A head tag
              # mostly doesn't exist until the linked repo rebuilds with the
              # dual-tagging build action, so preferring it unverified would
              # manufacture the phantom pin this guard exists to prevent.
              head_tag="development-head-${head_sha}"
              merge_tag="development-${merge_sha}"
              tag="$merge_tag"
              if [ "$ECR_CHECKS" = on ] && ecr_tag_exists "$repo" "$head_tag" && [ "$ECR_CHECKS" = on ]; then
                tag="$head_tag"
              elif [ "$ECR_CHECKS" = on ] && ! ecr_tag_exists "$repo" "$merge_tag"; then
                echo "::error::No ECR image for linked PR ${link}: neither ${head_tag} nor ${merge_tag} exists in $(ecr_repo_name "$repo"). The linked PR's base moved after its last build regenerated the merge SHA; re-run the linked repo's pipeline to build a fresh image, then re-run this job."
                exit 1
              fi
              set_args+=(
                --helm-set "tags.${repo}=${tag}"
                --helm-set "revisions.${repo}=${head_sha}"
              )
              ;;
          esac
        done < <(
          printf '%s\n' "$PR_BODY" \
            | grep -oE 'Deploys:[[:space:]]+[^#[:space:]]+#([0-9]+|staging|main)' \
            | while read -r _kw ref; do
                full="${ref%%#*}"; num="${ref##*#}"
                case "$full" in
                  */*) ;;
                  *)   full="${OWN_REPO%%/*}/$full" ;;
                esac
                [ "$full" = "$OWN_REPO" ] && continue
                # argocd-envs is the env's own parent chart, not a workload;
                # its branch is a label now. No lookup, refused after the loop.
                if [ "${full##*/}" = "argocd-envs" ]; then
                  echo "envs:${full}#${num}:${full##*/}::"
                  continue
                fi
                # `#staging` / `#main`: reuse the linked repo's release
                # pipeline outputs, moving ECR image tag + git branch.
                if [ "$num" = "staging" ] || [ "$num" = "main" ]; then
                  echo "line:${full}#${num}:${full##*/}:::${num}"
                  continue
                fi
                # Repos without an image: head SHA only, no ECR lookup.
                if is_revision_only_repo "${full##*/}"; then
                  head_sha="$(gh_api "/repos/$full/pulls/$num" | jq -r '.head.sha // ""')" || true
                  if [ -n "${head_sha:-}" ]; then
                    echo "revision-only:${full}#${num}:${full##*/}::${head_sha}"
                  else
                    echo "unresolved:${full}#${num}:${full##*/}::"
                  fi
                  continue
                fi
                # One API call, both SHAs out. merge_commit_sha is null on
                # unmergeable PRs; those become an unresolved marker (phase 2
                # fails the job and comments on the anchor PR).
                merge_sha=""; head_sha=""
                read -r merge_sha head_sha < <(
                  gh_api "/repos/$full/pulls/$num" \
                    | jq -r '[.merge_commit_sha // "", .head.sha // ""] | @tsv'
                ) || true
                if [ -n "${merge_sha:-}" ] && [ -n "${head_sha:-}" ]; then
                  echo "pr:${full}#${num}:${full##*/}:${merge_sha}:${head_sha}"
                else
                  echo "unresolved:${full}#${num}:${full##*/}::"
                fi
              done
        )

        # Post a comment on the anchor PR explaining a refused deploy.
        post_blocking_comment() {
          jq -n --arg b "$1" '{body: $b}' \
            | curl -sfX POST -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$OWN_REPO/issues/$PR_NUMBER/comments" \
                 --data @- >/dev/null \
            || echo "::warning::could not post the blocking comment to ${OWN_REPO}#${PR_NUMBER} (does the gh-token allow writing issue comments?)" >&2
        }

        # Fail closed on any unresolvable Deploys link, and comment on the
        # anchor PR so the cause is visible without digging through the log.
        if [ "${#unresolved_links[@]}" -gt 0 ]; then
          links="$(printf '%s, ' "${unresolved_links[@]}")"; links="${links%, }"
          comment="$(printf '**PR-env deploy blocked.**\n\nThese `Deploys:` link(s) could not be resolved, so the deploy was refused: %s\n\nA linked PR resolves to no `merge_commit_sha` when it is missing, closed, or in conflict with its base branch. Rather than silently deploy that repo from its default branch, this job fails.\n\nTo deploy:\n1. Fix each link above. For a PR in conflict, merge or rebase its base branch into it, push, and wait for its pipeline to finish. For a closed or wrong link, correct or remove that line in the description of this PR.\n2. Re-run the failed jobs from the Checks tab of this PR. The job reads this description and every linked PR again. Pushing a commit here also redeploys, from that new commit.\n\nDo not remove the `deploy` label to retry. Removing it deletes this env, and adding it back creates a new env with an empty database.' "$links")"
          post_blocking_comment "$comment"
          echo "::error::Refusing to deploy: unresolvable Deploys link(s): ${links}"
          exit 1
        fi

        # The parent chart's branch is a label, not a line, so the line gets
        # a comment saying which label to use instead of being ignored.
        if [ "${#envs_links[@]}" -gt 0 ]; then
          links="$(printf '%s, ' "${envs_links[@]}")"; links="${links%, }"
          comment="$(printf '**PR-env deploy blocked.**\n\n`Deploys: argocd-envs#N` is no longer read: %s\n\nThe parent chart'"'"'s branch is a label on this PR, `argocd-envs:<branch>`, which Argo CD reads itself and follows as the branch moves. Add the label with the argocd-envs PR'"'"'s branch name, remove the line above from this description, and re-run the failed jobs from the Checks tab. Removing the label puts the environment back on `main`.' "$links")"
          post_blocking_comment "$comment"
          echo "::error::Refusing to deploy: Deploys: argocd-envs links (${links}); use the argocd-envs:<branch> label."
          exit 1
        fi

        # What this run resolved, as tags.<repo>=<tag> and revisions.<repo>=<revision>
        # lines for the writer, which replaces both maps in the file with
        # exactly these. A link removed from the PR drops its pin here.
        settings=()
        for arg in "${set_args[@]}"; do
          case "$arg" in
            --helm-set) ;;
            *) settings+=("$arg") ;;
          esac
        done
        printf 'Deploying %s with:\n' "$PARENT_APP"
        printf '  %s\n' "${settings[@]}"

        # Write the environment's file in argocd-state. The parent Application
        # reads it as its values; the push is retried when another deploy
        # lands first.
        python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user PyYAML
        git -C argocd-state config user.name "mindsdb-release-train[bot]"
        git -C argocd-state config user.email "mindsdb-release-train[bot]@users.noreply.github.com"
        set_flags=()
        for setting in "${settings[@]}"; do set_flags+=(--set "$setting"); done
        write_out="${RUNNER_TEMP:-/tmp}/write-pr-env-state.out"
        : > "$write_out"
        python3 "$ACTION_PATH/../scripts/write_pr_env_state.py" \
          --repo-dir argocd-state --branch "$STATE_BRANCH" --env "$PARENT_APP" \
          "${set_flags[@]}" --github-output "$write_out"
        STATUS_URL="${ARGOCD_URL}/applications/${PARENT_APP}?operation=true"

        # Mark the head commit as waiting for Argo CD. The notifications
        # controller flips this status once the parent has synced, so a
        # commit that pushed nothing keeps the status its last sync left.
        if grep -qx 'pushed=true' "$write_out"; then
          jq -n --arg url "$STATUS_URL" '{state: "pending", context: "argocd/pr-env", description: "Waiting for Argo CD to sync", target_url: $url}' \
            | curl -sfX POST -H "Authorization: Bearer $STATUS_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$OWN_REPO/statuses/$OWN_HEAD_SHA" \
                --data @- >/dev/null
        else
          echo "Nothing pushed: reading the status Argo CD last set for ${OWN_HEAD_SHA}."
        fi

        # The env's mindshub_services SAM stack is not an ArgoCD child: the
        # pr-env-stacks workflow in mindsdb/mindshub_services deploys it from
        # revisions.mindshub_services (just written). Dispatch it for this
        # env now so the stack builds while the env rolls out, instead of on
        # that workflow's next scheduled run. Best-effort: a refused dispatch
        # (token without actions:write, or the workflow not yet on that
        # repo's default branch) is a warning, and the schedule catches up.
        # mindshub_services' own CI calls the workflow directly, so skip it.
        if [ "$OWN_SHORT" != "mindshub_services" ]; then
          if jq -n --arg only "$PARENT_APP" '{ref: "main", inputs: {only: $only}}' \
              | curl -sfX POST -H "Authorization: Bearer $STACKS_DISPATCH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/mindsdb/mindshub_services/actions/workflows/pr-env-stacks.yml/dispatches" \
                  --data @- >/dev/null; then
            echo "Dispatched mindshub_services pr-env-stacks.yml for ${PARENT_APP}."
          else
            echo "::warning::Could not dispatch mindshub_services/pr-env-stacks.yml for ${PARENT_APP}; its schedule will deploy the stack within ~10 minutes."
          fi
        fi

        # Wait for Argo CD's report on the head commit: success once the
        # parent has synced and every child is Healthy, failure when the sync
        # failed or timed out. Argo CD's own sync timeout is 30 minutes, so
        # the wait ends one way or the other.
        echo "Waiting for commit status argocd/pr-env on ${OWN_HEAD_SHA} (up to ${WAIT_TIMEOUT}s): ${STATUS_URL}"
        deadline=$(( $(date +%s) + WAIT_TIMEOUT ))
        while :; do
          state="$(gh_api "/repos/$OWN_REPO/commits/$OWN_HEAD_SHA/status" | jq -r '.statuses[] | select(.context == "argocd/pr-env") | .state' || true)"
          case "$state" in
            success)
              echo "Argo CD deployed ${PARENT_APP} from ${OWN_HEAD_SHA}."
              exit 0
              ;;
            failure|error)
              echo "::error::Argo CD reported ${state} for ${PARENT_APP}: the parent's sync failed or timed out. The parent and each child's state: ${STATUS_URL}"
              exit 1
              ;;
          esac
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::Argo CD has not reported on ${OWN_HEAD_SHA} within ${WAIT_TIMEOUT}s. The parent and each child's state: ${STATUS_URL}"
            exit 1
          fi
          sleep 20
        done
