# One implementation of "tell the engineering channel how a pipeline ended".
#
# It exists as a composite action rather than only as a reusable workflow because
# the two kinds of caller need different shapes and used to get different code:
#
#   A pipeline (prod-build-deploy, staging-build-deploy, publish-staging) needs a
#   terminal JOB that `needs:` every other job, so it calls
#   `notify-main-failure.yml`, which is now a thin wrapper around this.
#
#   A release-train workflow (freeze, unfreeze, sync, release-pr) owns its own
#   single job and can simply end with this step. Those used to push the alert out
#   to a per-repo wrapper job, which is how twenty-one callers ended up written as
#   `if: failure()` with no recovery mode at all: they could report that the sync
#   broke and never that it was fixed. On 2026-08-14 cowork's main -> staging sync
#   failed, alerted, was re-run successfully, and the notify job was SKIPPED, so
#   the channel was left holding a red alert for a sync that had already
#   succeeded.
#
# Both now run these steps, so a change to how an alert reads or when it is
# suppressed is one edit.
#
# `freeze-scoped` silences a STAGING caller entirely while the release-freeze
# window is closed — no red, no green, no grey. Mid-week staging is the
# integration branch, and posting only the recovery half of a story the channel
# was never told is worse than posting neither.
#
# Secrets and tokens are INPUTS, not `secrets` context: a composite action cannot
# read `secrets`. The App token is minted by the caller rather than here, because
# `continue-on-error` is not available to composite steps and a failure to mint
# must degrade to "assume frozen" rather than fail the job.
#
# WHETHER it posts and HOW it reads live in `scripts/notify_decision.py`, not in
# this file's `if:` expressions. Five inputs and three outcomes is more than a
# YAML condition can carry readably, and none of it was reachable by a test while
# it lived here — which is how the `workflow_dispatch` defect below survived
# review. `force-post` is now an explicit input rather than something inferred
# from `github.event_name`: a called workflow inherits the CALLER's context, so
# an event check here cannot tell "the notify workflow was dispatched as a smoke
# test" from "somebody manually ran a release-train wrapper", and all four of
# those wrappers declare `workflow_dispatch`.

name: Notify pipeline status
description: Post a pipeline failure or recovery to the engineering Slack channel, scoped to the release-freeze window.

inputs:
  env-name:
    description: "Short label for the pipeline (e.g. 'prod build+deploy', 'staging freeze')"
    required: true
  status:
    description: "'failed' (red alert) or 'recovered' (green, only if the prior run was failing)"
    required: false
    default: failed
  freeze-scoped:
    description: "'true' to stay silent entirely while the staging freeze window is closed"
    required: false
    default: "false"
  freeze-property:
    description: "The freeze custom property to read"
    required: false
    default: staging_frozen
  freeze-token:
    description: "A release-train App token. Empty means 'could not mint', which escalates to frozen."
    required: false
    default: ""
  github-token:
    description: "Token for the prior-run lookup behind the recovery message. Needs actions:read."
    required: false
    default: ""
  force-post:
    description: "'true' to post a recovery with no prior failure to recover from. The smoke test, and nothing else: a release-train wrapper must leave this alone or every manual run reports a recovery that did not happen."
    required: false
    default: "false"
  branch:
    description: "Branch to name in the message. Defaults to the running ref, which is wrong for a `workflow_run` caller, where GITHUB_REF is the default branch rather than the branch whose pipeline finished."
    required: false
    default: ${{ github.ref_name }}
  shared-path:
    description: "Where mindsdb/github-actions is checked out, for scripts/freeze_state.py"
    required: false
    default: .ci-shared
  slack-channel-id:
    description: "The engineering channel"
    required: true
  slack-bot-token:
    description: "The Slack bot token"
    required: true

runs:
  using: composite
  steps:
    # The freeze state is read FIRST and vetoes everything below it, including
    # the prior-run lookup that recovery mode would otherwise spend an API call
    # on.
    #
    # The signal is the `staging_frozen` custom property that the freeze/unfreeze
    # workflows set, not an inference from workflow-run history: a freeze that skipped
    # itself because staging had nothing unreleased still concludes `success`,
    # and history cannot tell that apart from a real freeze.
    #
    # `scripts/freeze_state.py` is also what those workflows use to WRITE it, so
    # one file owns the contract and renaming the property is one edit rather
    # than four that agree by luck.
    - name: Check release-freeze state
      id: freeze
      if: inputs.freeze-scoped == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.freeze-token }}
        REPO: ${{ github.repository }}
        FREEZE_PROPERTY: ${{ inputs.freeze-property }}
        SHARED: ${{ inputs.shared-path }}
      run: |
        set -uo pipefail
        # Every failure path lands on frozen=true. A notify step that cannot
        # establish the freeze state must escalate rather than silently downgrade
        # a real release-blocking failure; being wrong in this direction costs one
        # unnecessary alert.
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::No release-train App token. Treating the branch as frozen so failures still escalate."
          echo "frozen=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 "${SHARED}/scripts/freeze_state.py" read \
          --repo "${REPO}" --property-name "${FREEZE_PROPERTY}" --on-error escalate

    # For the recovery message, find out how the PREVIOUS conclusive run of this
    # same workflow on this same branch ended. This step only gathers evidence;
    # `notify_decision.py` below decides what it means.
    #
    # Skipped when nothing it could find would change the outcome: a failure posts
    # regardless, `force-post` posts regardless, and a freeze-scoped caller outside
    # the window posts nothing either way. `steps.freeze.outputs.frozen` is empty
    # when the freeze step did not run, which is not 'false', so an unscoped caller
    # still reaches this.
    #
    # BRANCH is deliberately the running ref rather than `inputs.branch`. For a
    # `workflow_run` caller those differ: the run is attributed to the default
    # branch, so that is where its own history lives, while the message wants the
    # branch whose pipeline finished.
    - name: Check how the previous run ended
      id: prev
      if: inputs.status == 'recovered' && inputs.force-post != 'true' && steps.freeze.outputs.frozen != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        BRANCH: ${{ github.ref_name }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -uo pipefail

        # A RE-RUN is the most common way a failure gets fixed, and it was the one
        # case this could never report. Attempts share a run id, so the failing
        # attempt is the very run the history lookup below excludes as "the
        # current one" — it would then find some older, green run and conclude
        # nothing had broken. Check the previous attempt first.
        if [ "${RUN_ATTEMPT:-1}" -gt 1 ]; then
          PREV_ATTEMPT=$((RUN_ATTEMPT - 1))
          if LAST=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${PREV_ATTEMPT}" \
                      --jq '.conclusion // ""' 2>&1); then
            echo "prev_conclusion=${LAST}" >> "$GITHUB_OUTPUT"
            echo "Attempt ${PREV_ATTEMPT} concluded '${LAST:-unknown}'."
            exit 0
          fi
          echo "Could not read attempt ${PREV_ATTEMPT}, falling back to run history: ${LAST}"
        fi

        # Match the workflow FILE rather than its display name, which a
        # `run-name:` override changes; fall back to the name if the ref does not
        # resolve to a path inside this repo.
        WF_PATH="${WORKFLOW_REF%%@*}"
        export WF_PATH="${WF_PATH#"${REPO}/"}"

        # Most recent CONCLUSIVE run on this branch, excluding the current one:
        # cancelled and skipped runs are not evidence either way.
        if ! PREV=$(gh api "repos/${REPO}/actions/runs?branch=${BRANCH}&status=completed&per_page=50" \
          --jq '[ .workflow_runs[]
                  | select(.path == env.WF_PATH or .name == env.WORKFLOW)
                  | select((.id|tostring) != env.RUN_ID)
                  | select(.conclusion == "success" or .conclusion == "failure"
                           or .conclusion == "timed_out" or .conclusion == "startup_failure")
                ][0].conclusion // ""' 2>&1); then
          # Almost always a missing `actions: read` grant on the caller job. Report
          # no evidence rather than failing: an unreadable history has to read as
          # "not a recovery", because a notify step must never redden a green run.
          echo "Could not read run history, so there is no evidence either way: ${PREV}"
          exit 0
        fi

        echo "prev_conclusion=${PREV}" >> "$GITHUB_OUTPUT"
        echo "Previous conclusive run on ${BRANCH} concluded '${PREV:-none}'."

    # One decision, one place, with tests. See scripts/notify_decision.py for the
    # three outcomes and why `force-post` is an input rather than an event check.
    - name: Decide whether to post, and how it reads
      id: msg
      shell: bash
      env:
        SHARED: ${{ inputs.shared-path }}
        STATUS: ${{ inputs.status }}
        FREEZE_SCOPED: ${{ inputs.freeze-scoped }}
        FROZEN: ${{ steps.freeze.outputs.frozen }}
        FORCE_POST: ${{ inputs.force-post }}
        PREV_CONCLUSION: ${{ steps.prev.outputs.prev_conclusion }}
      run: |
        set -euo pipefail
        python3 "${SHARED}/scripts/notify_decision.py" \
          --status "${STATUS}" \
          --freeze-scoped "${FREEZE_SCOPED}" \
          --frozen "${FROZEN}" \
          --force-post "${FORCE_POST}" \
          --prev-conclusion "${PREV_CONCLUSION}"

    - name: Notify Slack
      # The payload carries a top-level `text` as well as the blocks. Slack renders
      # the blocks, but `text` is what a push notification, a screen reader, and a
      # notification-list preview show, so without it the alert arrives on a phone
      # as an empty message — the one context where a pipeline failure most needs
      # to be readable.
      if: steps.msg.outputs.post == 'true'
      uses: slackapi/slack-github-action@v1.26.0
      with:
        channel-id: ${{ inputs.slack-channel-id }}
        payload: |
          {
            "text": "${{ steps.msg.outputs.prefix }}: ${{ github.event.repository.name }} ${{ inputs.env-name }} pipeline on ${{ inputs.branch }}",
            "attachments": [
              {
                "color": "${{ steps.msg.outputs.color }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ steps.msg.outputs.icon }} *<${{ github.server_url }}/${{ github.repository }}|${{ github.event.repository.name }}>* — *${{ inputs.env-name }}* pipeline ${{ steps.msg.outputs.verb }} on `${{ inputs.branch }}`"
                    },
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Workflow*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*${{ inputs.status == 'recovered' && 'Fixed by' || 'Triggered by' }}*\n${{ github.triggering_actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch*\n<${{ github.server_url }}/${{ github.repository }}/tree/${{ inputs.branch }}|${{ inputs.branch }}>"
                      }
                    ]
                  }
                ]
              }
            ]
          }
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
